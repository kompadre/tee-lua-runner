[package]
name = "tee-guest"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
# cdylib produces the .wasm artifact; rlib allows native builds/tests.
crate-type = ["cdylib", "rlib"]

[dependencies]
serde_json = { workspace = true }
hex = { workspace = true }
tee-proto = { path = "../tee-proto" }

# Native mock backend + native service tests (unusable on wasm32 where calls
# go through the real wasm imports instead).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
sha2 = { workspace = true }
hmac = { workspace = true }
hkdf = { workspace = true }
rand = { workspace = true }
tee-crypto = { path = "../tee-crypto" }
ed25519-dalek = { workspace = true }
zeroize = { workspace = true }

[features]
default = []
svc-echo = []
svc-counter = []
svc-hasher = []
svc-attest = []
svc-throttle = []
