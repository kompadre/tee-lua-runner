[package]
name = "runner-core"
version.workspace = true
edition.workspace = true

[dependencies]
wasmtime = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
hkdf = { workspace = true }
rand = { workspace = true }
hex = { workspace = true }
tee-attest = { path = "../tee-attest" }
tee-crypto = { path = "../tee-crypto" }
ed25519-dalek = { workspace = true }

[dev-dependencies]
# `wat` lets tests build module fixtures from text; it is intentionally absent
# from the production dependency so the runner only ever loads binary wasm.
wasmtime = { version = "50", default-features = false, features = [
    "cranelift",
    "runtime",
    "wat",
] }
