[workspace]
resolver = "2"
members = [
    "crates/tee-proto",
    "crates/tee-crypto",
    "crates/tee-attest",
    "crates/runner-core",
    "crates/runner-cli",
    "crates/tee-guest",
    "crates/enclave-bin",
    "crates/client",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
anyhow = "1"
sha2 = "0.10"
hmac = "0.12"
hkdf = "0.12"
rand = "0.8"
hex = "0.4"
wasmtime = { version = "50", default-features = false, features = ["cranelift", "runtime"] }
ciborium = "0.2"
ed25519-dalek = "2"
x25519-dalek = { version = "2", features = ["static_secrets"] }
chacha20poly1305 = "0.10"
zeroize = "1"

# Deterministic release builds for stable EIF measurements.
[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
